name: Build ponwrt firmware

on:
  workflow_dispatch:
    inputs:
      soc:
        description: 'SoC 目标'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583
      device_profile:
        description: '设备 profile（对应 configs/<soc>.config 里的 CONFIG_TARGET_DEVICE_*）'
        required: true
        default: 'nokia_xg-040g-md-ubi'
        type: string
      pin_commit:
        description: 'ponwrt 提交'
        required: false
        default: '03c134544714617e196dd399c85ebb90fb6eefa1'
        type: string
      jobs:
        description: 'make -j（runner 4 核，建议 4）'
        required: false
        default: '4'
        type: string
      make_release:
        description: '构建成功后发布到 Release'
        required: false
        default: false
        type: boolean
      smoke_only:
        description: '冒烟测试：只编到 ucode 就停（约 25 分钟，用于验证工具链/libffi）'
        required: false
        default: false
        type: boolean
      packages_only:
        description: '只编译更新插件的三个 .apk（curl / jsonfilter / luci-app-ponwrt-update），不出镜像'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.soc }}-${{ inputs.device_profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 取出仓库（workflow + 构建脚本）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 缓存源码包 dl/
        uses: actions/cache@v4
        with:
          # 放在源码树之外，否则 git clone 会因为 ~/ponwrt 已存在（缓存建的）而失败
          path: ~/ponwrt-dl
          key: dl-${{ inputs.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('build-ponwrt.sh') }}
          restore-keys: |
            dl-${{ inputs.soc }}-${{ inputs.pin_commit }}-
            dl-${{ inputs.soc }}-

      - name: 编译
        env:
          PONWRT_SOC: ${{ inputs.soc }}
          PONWRT_DEVICE: ${{ inputs.device_profile }}
          PONWRT_PIN: ${{ inputs.pin_commit }}
          PONWRT_JOBS: ${{ inputs.jobs }}
          PONWRT_SMOKE: ${{ inputs.smoke_only && '1' || '0' }}
          PONWRT_PKGS: ${{ inputs.packages_only && '1' || '0' }}
          PONWRT_DL: /home/runner/ponwrt-dl
          FORCE: '1'
        run: |
          chmod +x build-ponwrt.sh
          ./build-ponwrt.sh

      - name: 收集产物
        if: always()
        env:
          DEVICE_PROFILE: ${{ inputs.device_profile }}
        run: |
          mkdir -p artifact
          # 构建脚本把产物写到 $HOME/out（不是仓库目录下的 out/）
          cp "$HOME"/out/* artifact/ 2>/dev/null || true
          # 生成 version.json：固件内的更新检查靠它判断版本
          python3 - <<'PY'
          import json, os, re
          out = os.path.expanduser('~/out')
          ver = {}
          p = os.path.join(out, 'ponwrt-version')
          if os.path.exists(p):
              for line in open(p):
                  k, _, v = line.strip().partition('=')
                  if k:
                      ver[k] = v
          sha, itb = '', ''
          want = os.environ.get('DEVICE_PROFILE', '')
          sp = os.path.join(out, 'sha256sums')
          if os.path.exists(sp):
              for line in open(sp):
                  m = re.match(r'([0-9a-f]{64})\s+\*?(.+\.itb)', line.strip())
                  if m and 'sysupgrade' in m.group(2) and want and want in m.group(2):
                      sha, itb = m.group(1), m.group(2)
          if itb:
              data = {
                  'version': "%s-%s" % (ver.get('device', 'unknown'), ver.get('built', '')),
                  'device': ver.get('device', ''),
                  'commit': ver.get('commit', ''),
                  'built': ver.get('built', ''),
                  'file': itb,
                  'sha256': sha,
                  'notes': 'automated build',
              }
              with open(os.path.join(out, 'version.json'), 'w') as f:
                  json.dump(data, f, ensure_ascii=False)
              print('version.json:', data['version'])
          else:
              print('WARN: no sysupgrade itb found, skip version.json')
          PY
          cp "$HOME"/out/version.json artifact/ 2>/dev/null || true
          # 顺带把更新插件的 .apk 带出来，方便单独安装测试
          cp "$HOME"/ponwrt/bin/packages/*/luci/luci-app-ponwrt-update*.apk artifact/ 2>/dev/null || true
          cp "$HOME"/ponwrt/bin/packages/*/packages/curl-*.apk artifact/ 2>/dev/null || true
          cp "$HOME"/ponwrt/bin/packages/*/packages/jsonfilter-*.apk artifact/ 2>/dev/null || true
          cp "$HOME"/ponwrt-build-*.log artifact/ 2>/dev/null || true
          ls -lh artifact/ || true

      - name: 回写 version.json 到仓库
        if: success()
        run: |
          if [ -f "$HOME/out/version.json" ]; then
            cp "$HOME/out/version.json" ./version.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add version.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update version.json [skip ci]"
              git push || true
            fi
          fi

      - name: 上传 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ inputs.device_profile }}-${{ inputs.soc }}
          path: artifact/*
          retention-days: 30
          if-no-files-found: warn

      - name: 发布 Release
        if: ${{ inputs.make_release && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.device_profile }}-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" artifact/*.itb artifact/sha256sums artifact/ponwrt-version artifact/version.json \
            --title "${{ inputs.device_profile }} $TAG" \
            --notes "自动构建：ponwrt @ ${{ inputs.pin_commit }}" || true
