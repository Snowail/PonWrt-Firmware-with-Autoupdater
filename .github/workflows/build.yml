name: Build ponwrt firmware
run-name: ${{ inputs.make_release && 'Release' || inputs.smoke_only && 'Smoke' || inputs.packages_only && 'Packages' || 'Firmware' }} ${{ inputs.device_profile }} @ ${{ inputs.pin_commit }}

on:
  workflow_dispatch:
    inputs:
      soc:
        description: 'SoC 目标'
        required: true
        default: an7581
        type: choice
        options: [an7581, an7583]
      device_profile:
        description: '设备 profile（只构建此机型）'
        required: true
        default: nokia_xg-040g-md-ubi
        type: string
      pin_commit:
        description: 'ponwrt 完整 commit SHA；feeds 和主题由 sources.lock.json 固定'
        required: true
        default: 03c134544714617e196dd399c85ebb90fb6eefa1
        type: string
      jobs:
        description: 'make -j，默认 4'
        required: true
        default: '4'
        type: string
      make_release:
        description: '完整构建校验通过后发布 Release（首次诊断请关闭）'
        default: false
        type: boolean
      smoke_only:
        description: '仅验证工具链、libffi、ucode；不能发布'
        default: false
        type: boolean
      packages_only:
        description: '仅编译更新后端、curl、jsonfilter；不能发布'
        default: false
        type: boolean

permissions:
  contents: read

# Serialize publication as well as cache writes; do not interrupt a running build.
concurrency:
  group: ponwrt-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PONWRT_SOC: ${{ inputs.soc }}
      PONWRT_DEVICE: ${{ inputs.device_profile }}
      PONWRT_PIN: ${{ inputs.pin_commit }}
      PONWRT_JOBS: ${{ inputs.jobs }}
      PONWRT_SMOKE: ${{ inputs.smoke_only && '1' || '0' }}
      PONWRT_PKGS: ${{ inputs.packages_only && '1' || '0' }}
      PONWRT_DL: /home/runner/ponwrt-dl
      DIAG_DIR: /home/runner/ponwrt-diagnostics

    steps:
      - name: 取出构建脚本
        uses: actions/checkout@v4
        with:
          persist-credentials: ${{ inputs.make_release }}

      - name: 参数与脚本预检
        env:
          RELEASE: ${{ inputs.make_release }}
        run: |
          [[ "$PONWRT_SOC" =~ ^an758[13]$ ]]
          [[ "$PONWRT_DEVICE" =~ ^[a-z0-9][a-z0-9_-]+$ ]]
          [[ "$PONWRT_PIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PONWRT_JOBS" =~ ^[1-9][0-9]?$ ]]
          [[ "$PONWRT_SMOKE$PONWRT_PKGS" != 11 ]]
          if [[ "$RELEASE" == true ]]; then
            [[ "$PONWRT_SMOKE$PONWRT_PKGS" == 00 && "$GITHUB_REF" == refs/heads/main ]]
          fi
          bash -n build-ponwrt.sh tools/build-lib.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/test-build-lib.sh
          bash tests/test-update.sh
          node tests/test-notice.js

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 恢复下载缓存
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: ~/ponwrt-dl
          key: dl-v2-${{ runner.os }}-${{ inputs.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('sources.lock.json') }}-${{ inputs.device_profile }}-${{ hashFiles('build-ponwrt.sh', 'tools/prepare-config.py', 'package/**/Makefile') }}
          restore-keys: |
            dl-v2-${{ runner.os }}-${{ inputs.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('sources.lock.json') }}-
            dl-v2-${{ runner.os }}-${{ inputs.soc }}-

      - name: 恢复编译缓存
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/ponwrt-ccache
          key: cc-v1-${{ runner.os }}-${{ inputs.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('sources.lock.json', 'build-ponwrt.sh', 'tools/**', 'package/**', 'overlay/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cc-v1-${{ runner.os }}-${{ inputs.soc }}-${{ inputs.pin_commit }}-
            cc-v1-${{ runner.os }}-${{ inputs.soc }}-

      - name: 编译与产物校验
        id: compile
        timeout-minutes: 325
        env:
          CCACHE_MAXSIZE: 4G
        run: bash build-ponwrt.sh

      - name: 收集诊断和已校验产物
        id: collect
        if: always()
        run: |
          mkdir -p artifact/diagnostics
          if [[ -d "$DIAG_DIR" ]]; then cp -a "$DIAG_DIR/." artifact/diagnostics/; fi
          if [[ -d "$HOME/out" ]]; then cp -a "$HOME/out/." artifact/; fi
          printf 'run=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > artifact/diagnostics/workflow.txt
          cp sources.lock.json artifact/diagnostics/
          if [[ -f "$DIAG_DIR/download.ok" ]]; then echo 'download_complete=true' >> "$GITHUB_OUTPUT"; fi
          if [[ -f "$DIAG_DIR/compile.ok" ]]; then echo 'compile_complete=true' >> "$GITHUB_OUTPUT"; fi

      - name: 上传 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ inputs.device_profile }}-${{ inputs.soc }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: 保存已完成下载缓存（编译失败时也保留）
        if: ${{ !cancelled() && steps.dl.outcome == 'success' && steps.dl.outputs.cache-hit != 'true' && steps.collect.outputs.download_complete == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/ponwrt-dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      - name: 保存编译缓存
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' && (steps.compile.outcome == 'success' || steps.collect.outputs.compile_complete == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: ~/ponwrt-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: 发布完整 Release
        if: ${{ success() && inputs.make_release && !inputs.smoke_only && !inputs.packages_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifact
          sha256sum -c sha256sums
          TAG="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          LATEST=false
          if [[ "$PONWRT_SOC" == an7581 && "$PONWRT_DEVICE" == nokia_xg-040g-md-ubi ]]; then LATEST=true; fi
          gh release create "$TAG" ./*.itb ./*.manifest sha256sums ponwrt-version version.json profiles.json \
            --draft --target "$GITHUB_SHA" --title "$TAG" --notes "ponwrt @ $PONWRT_PIN; run $GITHUB_RUN_ID"
          gh release edit "$TAG" --draft=false --latest="$LATEST"

      - name: 发布成功后回写正式设备版本
        if: ${{ success() && inputs.make_release && !inputs.smoke_only && !inputs.packages_only && inputs.soc == 'an7581' && inputs.device_profile == 'nokia_xg-040g-md-ubi' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B metadata-update origin/main
          cp artifact/version.json version.json
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish verified firmware metadata [skip ci]'
            git push origin HEAD:main
          fi
