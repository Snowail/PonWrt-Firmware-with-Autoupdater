name: Build ponwrt firmware
run-name: ${{ inputs.make_release && 'Release' || 'Firmware' }} all @ ${{ inputs.pin_commit }}

on:
  workflow_dispatch:
    inputs:
      pin_commit:
        description: 'ponwrt 完整 commit SHA；feeds 和主题由 sources.lock.json 固定'
        required: true
        default: 03c134544714617e196dd399c85ebb90fb6eefa1
        type: string
      retry_run:
        description: '仅补跑此运行中未成功的机型，留空构建全部机型'
        default: ''
        type: string
      cleanup_old_releases:
        description: '本次发布成功并更新索引后删除此前全部 Release'
        default: false
        type: boolean
      publish_run:
        description: '可选：仅发布指定运行已成功构建的全部机型 Artifact'
        default: ''
        type: string
      base_run:
        description: '可选：复用指定运行的匹配基础产物，校验上游提交与 sources.lock'
        default: ''
        type: string
      jobs:
        description: 'make -j，默认 4'
        required: true
        default: '4'
        type: string
      make_release:
        description: '完整构建校验通过后发布 Release（首次诊断请关闭）'
        default: false
        type: boolean

permissions:
  contents: read

# Serialize workflow runs; matrix jobs within each run execute concurrently.
concurrency:
  group: ponwrt-build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      bases: ${{ steps.targets.outputs.bases }}
      upstream_time: ${{ steps.upstream.outputs.time }}
    steps:
      - uses: actions/checkout@v4
      - name: Read target configs from the pinned upstream revision
        env:
          PIN: ${{ inputs.pin_commit }}
        run: |
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p upstream/configs
          for soc in an7581 an7583; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/pbs05/ponwrt/$PIN/configs/$soc.config" -o "upstream/configs/$soc.config"
          done
      - name: 检查发布范围
        env:
          RELEASE: ${{ inputs.make_release }}
          RETRY_RUN: ${{ inputs.retry_run }}
        run: |
          if [[ "$RELEASE" == true && -n "$RETRY_RUN" ]]; then
            echo "统一 Release 必须包含全部机型，请使用完整构建发布"
            exit 1
          fi
      - name: 读取待补跑任务
        if: inputs.retry_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_RUN: ${{ inputs.retry_run }}
        run: |
          [[ "$RETRY_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RETRY_RUN" > retry-run.json
          python3 -c 'import json,os; r=json.load(open("retry-run.json")); assert r["path"] == ".github/workflows/build.yml" and r["status"] == "completed"'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RETRY_RUN/jobs?filter=latest&per_page=100" > retry-jobs.json
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.pin_commit }}
        run: |
          time=$(gh api "repos/pbs05/ponwrt/commits/$PIN" --jq .commit.committer.date)
          echo "time=$time" >> "$GITHUB_OUTPUT"
      - id: targets
        run: python3 tools/build-matrix.py

  base:
    needs: plan
    if: inputs.publish_run == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.bases) }}
    name: Base / ${{ matrix.soc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    env:
      PONWRT_SOC: ${{ matrix.soc }}
      PONWRT_DEVICE: all
      PONWRT_PIN: ${{ inputs.pin_commit }}
      PONWRT_JOBS: ${{ inputs.jobs }}
      PONWRT_SMOKE: '0'
      PONWRT_PKGS: '0'
      PONWRT_DL: /home/runner/ponwrt-dl
      DIAG_DIR: /home/runner/ponwrt-diagnostics
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G

    steps:
      - name: 取出构建脚本
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 恢复完整 Image Builder 基础产物
        id: bundle
        uses: actions/cache/restore@v4
        with:
          path: ~/base
          key: ib-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('sources.lock.json', 'build-ponwrt.sh', 'public-packages.txt', 'package/**', 'tools/prepare-config.py', 'tools/source-lock.py', 'tools/99-ponwrt-service-defaults', 'tools/build-lib.sh', 'tools/export-imagebuilder.py') }}

      - name: 导入指定运行的 Image Builder
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run != ''
        uses: actions/download-artifact@v4
        with:
          name: imagebuilder-${{ matrix.soc }}
          path: ~/base
          run-id: ${{ inputs.base_run }}
          github-token: ${{ github.token }}
      - name: 导入基础产物的版本锁定记录
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run != ''
        uses: actions/download-artifact@v4
        with:
          name: base-diagnostics-${{ matrix.soc }}
          path: imported-diagnostics
          run-id: ${{ inputs.base_run }}
          github-token: ${{ github.token }}
      - name: 校验导入基础产物
        id: imported
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run != ''
        run: |
          cmp sources.lock.json imported-diagnostics/diagnostics/sources.lock.json
          python3 -c 'import json,os; b=json.load(open(os.path.expanduser("~/base/base.json"))); assert b["commit"] == os.environ["PONWRT_PIN"] and b["soc"] == os.environ["PONWRT_SOC"]'
          cd ~/base
          sha256sum -c sha256sums

      - name: 参数与脚本预检
        env:
          RELEASE: ${{ inputs.make_release }}
        run: |
          [[ "$PONWRT_SOC" =~ ^an758[13]$ ]]
          [[ "$PONWRT_DEVICE" =~ ^[a-z0-9][a-z0-9_-]+$ ]]
          [[ "$PONWRT_PIN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PONWRT_JOBS" =~ ^[1-9][0-9]?$ ]]
          [[ "$PONWRT_SMOKE$PONWRT_PKGS" != 11 ]]
          if [[ "$RELEASE" == true ]]; then
            [[ "$PONWRT_SMOKE$PONWRT_PKGS" == 00 && "$GITHUB_REF" == refs/heads/main ]]
          fi
          bash -n build-ponwrt.sh tools/build-lib.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/test-build-lib.sh
          bash tests/test-update.sh
          node tests/test-notice.js

      - name: 释放磁盘空间
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 恢复下载缓存
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run == ''
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: ~/ponwrt-dl
          key: dl-v3-${{ runner.os }}-${{ matrix.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('sources.lock.json') }}-${{ hashFiles('public-packages.txt', 'build-ponwrt.sh', 'tools/prepare-config.py', 'package/**/Makefile') }}
          restore-keys: |
            dl-v3-${{ runner.os }}-${{ matrix.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('sources.lock.json') }}-
            dl-v3-${{ runner.os }}-${{ matrix.soc }}-

      - name: 恢复编译缓存
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run == ''
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/ponwrt-ccache
          key: cc-v3-${{ runner.os }}-${{ matrix.soc }}-${{ inputs.pin_commit }}-${{ hashFiles('sources.lock.json', 'build-ponwrt.sh', 'tools/**', 'package/**', 'overlay/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cc-v3-${{ runner.os }}-${{ matrix.soc }}-${{ inputs.pin_commit }}-
            cc-v3-${{ runner.os }}-${{ matrix.soc }}-

      - name: 准备源码、配置与下载
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run == ''
        id: prepare
        env:
          PONWRT_STAGE: prepare
        run: bash build-ponwrt.sh

      - name: 恢复工具链缓存（精确配置匹配）
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run == ''
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/ponwrt/staging_dir/host
            ~/ponwrt/staging_dir/toolchain-*
            ~/ponwrt/build_dir/host
            ~/ponwrt/build_dir/toolchain-*
          key: tc-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.soc }}-all-${{ steps.prepare.outputs.toolchain_key }}

      - name: 检查并完成工具链
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run == ''
        id: tools
        env:
          PONWRT_STAGE: toolchain
        run: bash build-ponwrt.sh

      - name: 保存完整工具链（不等待固件成功）
        if: steps.bundle.outputs.cache-hit != 'true' && steps.tools.outcome == 'success' && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/ponwrt/staging_dir/host
            ~/ponwrt/staging_dir/toolchain-*
            ~/ponwrt/build_dir/host
            ~/ponwrt/build_dir/toolchain-*
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: 编译与产物校验
        if: steps.bundle.outputs.cache-hit != 'true' && inputs.base_run == ''
        id: compile
        timeout-minutes: 325
        env:
          PONWRT_STAGE: build
        run: bash build-ponwrt.sh

      - name: 收集诊断和已校验产物
        id: collect
        if: always()
        run: |
          mkdir -p artifact/diagnostics
          if [[ -d "$DIAG_DIR" ]]; then cp -a "$DIAG_DIR/." artifact/diagnostics/; fi
          if [[ -d "$HOME/out" ]]; then cp -a "$HOME/out/." artifact/; fi
          printf 'run=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > artifact/diagnostics/workflow.txt
          cp sources.lock.json artifact/diagnostics/
          if [[ -f "$DIAG_DIR/download.ok" ]]; then echo 'download_complete=true' >> "$GITHUB_OUTPUT"; fi
          if [[ -f "$DIAG_DIR/compile.ok" ]]; then echo 'compile_complete=true' >> "$GITHUB_OUTPUT"; fi

      - name: 保存完整基础产物
        if: steps.bundle.outputs.cache-hit != 'true' && (steps.compile.outcome == 'success' || steps.imported.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: ~/base
          key: ${{ steps.bundle.outputs.cache-primary-key }}

      - name: 上传 Image Builder 基础产物
        uses: actions/upload-artifact@v4
        with:
          name: imagebuilder-${{ matrix.soc }}
          path: ~/base/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: 上传基础编译诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-diagnostics-${{ matrix.soc }}
          path: artifact/
          include-hidden-files: true
          retention-days: 14

      - name: 保存已完成下载缓存（编译失败时也保留）
        if: ${{ !cancelled() && steps.dl.outcome == 'success' && steps.dl.outputs.cache-hit != 'true' && steps.collect.outputs.download_complete == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/ponwrt-dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      - name: 保存编译缓存
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' && steps.prepare.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/ponwrt-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  build:
    needs: [plan, base]
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.publish_run == '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.soc }} / ${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PONWRT_SOC: ${{ matrix.soc }}
      PONWRT_DEVICE: ${{ matrix.device }}
      UPSTREAM_TIME: ${{ needs.plan.outputs.upstream_time }}
      PONWRT_PIN: ${{ inputs.pin_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: imagebuilder-${{ matrix.soc }}
          path: ~/base
      - name: 安装组装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev zlib1g-dev libssl-dev gawk gettext rsync unzip zstd file python3
      - name: Image Builder 组装与校验
        run: |
          set -o pipefail
          bash tools/assemble-image.sh 2>&1 | tee imagebuilder.log
      - name: 收集产物与日志
        if: always()
        run: |
          mkdir -p artifact/diagnostics
          if [[ -d "$HOME/out" ]]; then cp -a "$HOME/out/." artifact/; fi
          if [[ -f imagebuilder.log ]]; then cp imagebuilder.log artifact/diagnostics/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ponwrt-${{ matrix.device }}-${{ matrix.soc }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact/
          retention-days: 30
          if-no-files-found: error
  metadata:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.make_release && (inputs.publish_run != '' || needs.build.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: published
          run-id: ${{ inputs.publish_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: 汇总并发布全部机型
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TIME: ${{ needs.plan.outputs.upstream_time }}
          SOURCE_RUN: ${{ inputs.publish_run || github.run_id }}
          EXPECTED_MATRIX: ${{ needs.plan.outputs.matrix }}
          PIN: ${{ inputs.pin_commit }}
        run: |
          python3 tools/prepare-release.py published release "$UPSTREAM_TIME"
          python3 -c 'import json,os; c=json.load(open("release/version.json")); e=json.loads(os.environ["EXPECTED_MATRIX"])["include"]; assert c["commit"] == os.environ["PIN"]; assert {(d["soc"],d["device"]) for d in e} == {(d["target"],d["device"]) for d in c["devices"].values()}'
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          cd release
          sha256sum -c sha256sums
          TAG=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          TITLE=$(python3 -c 'import json; print("PonWrt " + json.load(open("version.json"))["display_version"] + " (UTC+8)")')
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$SOURCE_SHA" --title "$TITLE" --notes "全部机型升级固件。上游 $UPSTREAM_TIME，构建 $SOURCE_RUN。"
          fi
          gh release upload "$TAG" ./* --clobber
          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > ../remote-release.json
          cd ..
          python3 tools/verify-release-assets.py release remote-release.json
          gh release edit "$TAG" --draft=false --latest=true
      - name: 发布成功后更新版本索引
        run: |
          python3 tools/publish-metadata.py release
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish verified firmware metadata [skip ci]'
            git push origin HEAD:main
          fi
      - name: 清理此前全部 Release
        if: inputs.cleanup_old_releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python3 -c 'import json; print(json.load(open("release/version.json"))["version"])')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > current-release.json
          python3 -c 'import json; r=json.load(open("current-release.json")); assert not r["draft"]'
          created=$(jq -r .created_at current-release.json)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name != \"$TAG\" and .created_at <= \"$created\") | .tag_name" > old-releases.txt
          while IFS= read -r old; do
            [[ -z "$old" ]] || gh release delete "$old" --yes
          done < old-releases.txt
