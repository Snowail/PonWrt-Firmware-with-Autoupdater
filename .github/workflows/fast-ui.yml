name: Test backup and update page

on: workflow_dispatch

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 生成测试机专用的备份与更新页面
        run: python3 tools/build-fast-ui.py out
      - name: 验证安装与回滚
        run: |
          sh -n fast-ui/apply.sh
          bash tests/test-fast-ui.sh out
          bash tests/test-update.sh
          node tests/test-notice.js
      - uses: actions/upload-artifact@v4
        with:
          name: ponwrt-fast-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
          if-no-files-found: error
